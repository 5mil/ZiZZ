<!DOCTYPE html>
<html><head><title>ZiZZ</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#0a0a0f 0%,#1a1a2e 100%);color:#e8e8f0;margin:0;min-height:100vh}
nav{background:rgba(20,20,30,.95);backdrop-filter:blur(12px);padding:14px 20px;display:flex;gap:6px;border-bottom:1px solid #2a2a3e;position:sticky;top:0;z-index:10}
nav button{padding:10px 18px;background:transparent;color:#aaa;border:0;border-radius:8px;cursor:pointer;font-size:14px;transition:.15s}
nav button:hover{background:#2a2a3e;color:#fff}
nav button.on{background:#3b82f6;color:#fff}
.page{padding:28px;display:none;max-width:720px}
.page.on{display:block}
h2{font-weight:500;margin:0 0 16px;font-size:22px;color:#fff}
input{padding:12px 14px;background:#16161f;color:#fff;border:1px solid #2a2a3e;border-radius:8px;width:100%;max-width:320px;margin:6px 0;font-size:15px}
input:focus{outline:none;border-color:#3b82f6}
button.act{padding:10px 20px;background:#3b82f6;color:#fff;border:0;border-radius:8px;cursor:pointer;font-size:14px;margin:8px 6px 8px 0;transition:.15s}
button.act:hover{background:#2563eb}
table{width:100%;border-collapse:collapse;margin-top:16px;background:#16161f;border-radius:10px;overflow:hidden}
td,th{padding:12px 14px;border-bottom:1px solid #222;text-align:left;font-size:14px}
th{color:#888;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.big{font-size:36px;font-weight:300;margin:12px 0;color:#fff}
.card{background:#16161f;border:1px solid #2a2a3e;border-radius:12px;padding:20px;margin:12px 0}
a{color:#60a5fa}
</style></head><body>
<nav>
<button onclick="tab('ov')" id=tov class=on>Overview</button>
<button onclick="tab('send')" id=tsend>Send</button>
<button onclick="tab('recv')" id=trecv>Receive</button>
<button onclick="tab('tx')" id=ttx>Transactions</button>
<button onclick="tab('mine')" id=tmine>Mining</button>
<button onclick="tab('addr')" id=taddr>Addresses</button>
<button onclick="tab('expl')" id=texpl>Explorer</button>
<button onclick="tab('cons')" id=tcons>Console</button>
<button onclick="tab('nodes')" id=tnodes>Nodes</button>
</nav>
<div id=ov class="page on">
<h2>Overview</h2>
<div class=card>
<div class=big id=bal>0 ZiZZ</div>
<p style="color:#888">Height: <span id=h>0</span></p>
</div>
<p><a href="http://127.0.0.1:8337" target=_blank>Open Explorer ↗</a></p>
</div>
<div id=send class=page>
<h2>Send</h2>
<input id=to placeholder="To address"><br>
<input id=amt placeholder="Amount (ZiZZ)"><br>
<button class=act onclick="doSend()">Send</button>
</div>
<div id=recv class=page>
<h2>Receive</h2>
<button class=act onclick="doNew()">New Address</button>
<div id=newaddr></div>
</div>
<div id=tx class=page>
<h2>Transactions</h2>
<table><thead><tr><th>Height</th><th>Address</th><th>Amount</th></tr></thead><tbody id=txs></tbody></table>
</div>
<div id=mine class=page>
<h2>Mining</h2>
<input id=nblocks value="1" style=width:80px> blocks<br>
<button class=act onclick="doMine()">Mine</button>
<button class=act onclick="doMineCont()">Mine Continuous</button>
</div>
<div id=addr class=page>
<h2>Addresses</h2>
<table><thead><tr><th>#</th><th>Address</th><th>Balance</th></tr></thead><tbody id=addrs></tbody></table>
</div>
<div id=cons class=page>
<h2>Console</h2>
<div id=clog style="background:#16161f;padding:12px;border-radius:8px;height:200px;overflow:auto;font-family:monospace;font-size:13px"></div>
<input id=ccmd placeholder="help, getbalance, getnewaddress, generate" style="margin-top:8px">
<button class=act onclick="runCmd()">Run</button>
</div>
<div id=nodes class=page>
<h2>Nodes</h2>
<div class=card>
<p>127.0.0.1:8339 — <span id=nstat>local</span></p>
<button class=act onclick="document.getElementById('nstat').textContent='offline'">Disconnect</button>
</div>
<p style="color:#888">No other peers. P2P arrives in Phase 4.</p>
</div>
<div id=expl class=page style="padding:0;height:calc(100vh - 50px)">
<iframe src="http://127.0.0.1:8337" style="width:100%;height:100%;border:0"></iframe>
</div>
<script>
function tab(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));document.getElementById('t'+id).classList.add('on');if(id=='tx')loadTx();if(id=='addr')loadAddr();}
async function refresh(){try{const r=await getInfo();const d=JSON.parse(r);document.getElementById('h').textContent=d.height;document.getElementById('bal').textContent=(d.balance/1e8).toFixed(8)+' ZiZZ';}catch(e){}}
async function doMine(){const n=parseInt(document.getElementById('nblocks').value)||1;await mineN(n);refresh();}
async function doMineCont(){for(let i=0;i<5;i++){await mineN(1);await new Promise(r=>setTimeout(r,200));}refresh();}
async function doNew(){const a=await newAddress();document.getElementById('newaddr').textContent=a;refresh();}
async function doSend(){const to=document.getElementById('to').value;const amt=Math.floor(parseFloat(document.getElementById('amt').value)*1e8);if(to&&amt){await send(to,amt);refresh();alert('sent');}}
async function loadTx(){const r=await listTxs();const d=JSON.parse(r);document.getElementById('txs').innerHTML=d.map(t=>`<tr><td>${t.h}</td><td>${t.a.slice(0,18)}...</td><td>${(t.s/1e8).toFixed(8)}</td></tr>`).join('');}
async function loadAddr(){const r=await listAddrs();const d=JSON.parse(r);document.getElementById('addrs').innerHTML=d.map((a,i)=>`<tr><td>${i+1}</td><td>${a.a.slice(0,20)}...</td><td>${(a.b/1e8).toFixed(8)}</td></tr>`).join('');}
async function runCmd(){
  const c=document.getElementById('ccmd').value.trim();
  const log=document.getElementById('clog');
  log.innerHTML+='> '+c+'<br>';
  if(c==='help') log.innerHTML+='commands: help, getbalance, getnewaddress, generate<br>';
  else if(c==='getbalance'){const r=await getInfo();const d=JSON.parse(r);log.innerHTML+=(d.balance/1e8).toFixed(8)+' ZiZZ<br>';}
  else if(c==='getnewaddress'){const a=await newAddress();log.innerHTML+=a+'<br>';}
  else if(c==='generate'){await mineN(1);log.innerHTML+='mined 1<br>';refresh();}
  else if(c) log.innerHTML+='unknown<br>';
  document.getElementById('ccmd').value='';
}
setInterval(refresh,2000);refresh();
</script></body></html>
